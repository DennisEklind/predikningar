<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karlskoga Baptist Podcast</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .episode {
            background-color: #fff;
            border: 1px solid #ddd;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 5px;
        }

        .episode h2 {
            margin: 0;
            font-size: 1.2em;
        }

        .episode p {
            font-size: 1em;
        }

        .episode a {
            color: #007bff;
            text-decoration: none;
        }

        .episode a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>Karlskoga Baptist Podcast</h1>
    <div id="episodes"></div>

    <script>
        // RSS-feed URL
        const feedUrl = "https://feeds.acast.com/public/shows/karlskogabaptist";

        // Funktion för att hämta och visa podcastavsnitt
       
async function fetchEpisodes() {
    const episodesContainer = document.getElementById("episodes");

    try {
        const response = await fetch("./episodes.json");

        if (!response.ok) {
            throw new Error(`HTTP-fel: ${response.status}`);
        }

        const data = await response.json();

        episodesContainer.replaceChildren();

        data.episodes.forEach(episode => {
            const episodeElement = document.createElement("div");
            episodeElement.classList.add("episode");

            const title = document.createElement("h2");
            title.textContent = episode.title;
            episodeElement.appendChild(title);

            const description = document.createElement("p");
            const date = new Date(episode.pubDate)
                .toLocaleDateString("sv-SE");

            description.textContent =
                `${episode.speaker}   ${date}`;

            episodeElement.appendChild(description);

            const audio = document.createElement("audio");
            audio.controls = true;
            audio.preload = "none";
            audio.src = episode.audioUrl;
            audio.style.width = "100%";

            episodeElement.appendChild(audio);

            const link = document.createElement("a");
            link.href = episode.link;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.textContent = "Öppna avsnittet hos Acast";

            episodeElement.appendChild(link);
            episodesContainer.appendChild(episodeElement);
        });

        console.log(`Visar ${data.count} podcastavsnitt`);

    } catch (error) {
        console.error("Kunde inte läsa podcastarkivet:", error);
        episodesContainer.textContent =
            "Kunde inte hämta podcastavsnitten just nu.";
    }
}

fetchEpisodes();
    </script>

</body>
</html>
