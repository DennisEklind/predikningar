<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karlskoga Baptist Podcast</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .episode {
            background-color: #fff;
            border: 1px solid #ddd;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 5px;
        }

        .episode h2 {
            margin: 0;
            font-size: 1.2em;
        }

        .episode p {
            font-size: 1em;
        }

        .episode a {
            color: #007bff;
            text-decoration: none;
        }

        .episode a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>Karlskoga Baptist Podcast</h1>
    <div id="episodes"></div>

    <script>
        // RSS-feed URL
        const feedUrl = "https://feeds.acast.com/public/shows/karlskogabaptist";

        // Funktion för att hämta och visa podcastavsnitt
        async function fetchEpisodes() {
        const response = await fetch(
            `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}`
        );

        const data = await response.json();
        const episodesContainer = document.getElementById("episodes");

            if (data.status === 'ok') {
                const episodes = data.items;
                episodes.forEach(episode => {
                    const episodeElement = document.createElement("div");
                    episodeElement.classList.add("episode");

                    const title = document.createElement("h2");
                    title.textContent = episode.title;
                    episodeElement.appendChild(title);

                    const description = document.createElement("p");
                    description.innerHTML =
                    episode.description.split("<hr>")[0] +
                    "&nbsp;&nbsp;&nbsp;" +
                    episode.pubDate.substring(0, 10);
                    episodeElement.appendChild(description);

                    const link = document.createElement("a");
                    link.href = episode.enclosure.link;
                    link.target = "_blank";
                    link.textContent = "Lyssna på avsnittet";
                    episodeElement.appendChild(link);

                    episodesContainer.appendChild(episodeElement);
                });
            } else {
                episodesContainer.innerHTML = "<p>Kunde inte hämta podcastavsnitt.</p>";
            }
        }

        // Anropa funktionen för att hämta och visa avsnitten
        fetchEpisodes();
    </script>

</body>
</html>
