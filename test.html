<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Predikningar – Karlskoga Baptist</title>

<style>
:root {
    --blue: #1769c2;
    --blue-hover: #1055a0;
    --blue-light: #eaf3ff;
    --text: #202631;
    --muted: #707987;
    --border: #e4e8ee;
    --background: #f6f8fb;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 24px 16px;
    background: var(--background);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}

header, .podcast {
    max-width: 850px;
    margin-left: auto;
    margin-right: auto;
}

header {
    margin-bottom: 22px;
}

h1 {
    margin: 0 0 5px;
    font-size: clamp(1.6rem, 4vw, 2.1rem);
    letter-spacing: -0.04em;
}

header p {
    color: var(--muted);
    margin: 0;
}

/* Den gemensamma spelaren */

.now-playing {
    background: white;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    box-shadow: 0 3px 12px #172b4608;
    margin-bottom: 18px;
}

.player-heading {
    display: flex;
    gap: 15px;
    align-items: flex-start;
}

.cover {
    flex: 0 0 66px;
    height: 66px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    color: white;
    background: var(--blue);
    font-size: 30px;
}

.track-info {
    flex: 1;
    min-width: 0;
}

.track-info h2 {
    font-size: 1.15rem;
    line-height: 1.4;
    margin: 0 0 5px;
    overflow-wrap: anywhere;
}

.track-meta {
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.5;
    margin: 0;
}

.controls {
    display: flex;
    align-items: center;
    gap: 13px;
    margin-top: 22px;
}

.play-button {
    flex: 0 0 50px;
    width: 50px;
    height: 50px;
    border: none;
    border-radius: 50%;
    background: var(--blue);
    color: white;
    font-size: 21px;
    cursor: pointer;
    display: grid;
    place-items: center;
}

.play-button:hover {
    background: var(--blue-hover);
}

.play-button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.skip-button {
    border: 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    padding: 7px 0;
    font-size: 0.8rem;
    white-space: nowrap;
}

.skip-button:hover {
    color: var(--blue);
}

.timeline {
    flex: 1;
    min-width: 0;
}

.progress {
    display: block;
    width: 100%;
    height: 6px;
    margin: 4px 0 8px;
    accent-color: var(--blue);
    cursor: pointer;
}

.time-row {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 0.76rem;
    font-variant-numeric: tabular-nums;
}

/* Sökfältet */
.search-container {
    margin: 22px 0 12px;
}

.search-input {
    width: 100%;
    padding: 12px 16px;
    font-size: 0.95rem;
    border: 1px solid #d3dbe6;
    border-radius: 10px;
    background: white;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
}

.search-input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px #9ac8ff40;
}

/* Avsnittslistan */

.list-heading {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin: 10px 2px 10px;
}

.list-heading h2 {
    margin: 0;
    font-size: 1.1rem;
}

#episode-count {
    color: var(--muted);
    font-size: 0.85rem;
}


.episode-list {
    background: transparent;
    border: none;
    border-radius: 0;
    overflow-y: auto;
    max-height: 460px;
    overscroll-behavior: contain;

    display: flex;
    flex-direction: column;
    gap: 6px;
}

.episode-row {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 9px 12px;
    border: 1px solid #d3dbe6;
    border-radius: 9px;
    background: white;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
}

.episode-row:hover {
    background: #f2f7ff;
    border-color: #9dbce2;
}

.episode-row.selected {
    background: #eaf3ff;
    border-color: #1769c2;
}

.row-play {
    flex: 0 0 30px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #edf0f5;
    color: #465365;
    display: grid;
    place-items: center;
    font-size: 13px;
}

.selected .row-play {
    background: #1769c2;
    color: white;
}

.row-info {
    flex: 1;
    min-width: 0;
}

.row-title {
    margin: 0 0 2px;
    font-size: 0.9rem;
    font-weight: 600;
    line-height: 1.3;
    overflow-wrap: anywhere;
}

.row-meta {
    color: #707987;
    font-size: 0.76rem;
    line-height: 1.3;
}
.episode-row:focus-visible,
.play-button:focus-visible,
.skip-button:focus-visible,
.progress:focus-visible {
    outline: 3px solid #9ac8ff;
    outline-offset: 3px;
}

.status {
    color: var(--muted);
    padding: 24px;
    text-align: center;
}

@media (max-width: 480px) {
    body {
        padding: 18px 10px;
    }

    .now-playing {
        padding: 16px;
    }

    .cover {
        flex-basis: 52px;
        height: 52px;
        font-size: 24px;
    }

    .track-info h2 {
        font-size: 1.03rem;
    }

    .controls {
        gap: 9px;
    }

    .play-button {
        flex-basis: 44px;
        width: 44px;
        height: 44px;
    }

    .skip-button {
        font-size: 0.72rem;
    }

    .episode-row {
        padding: 12px;
        gap: 10px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Predikningar</h1>
    <p>Karlskoga Baptistförsamling</p>
</header>

<main class="podcast">

    <section class="now-playing" aria-label="Podcastspelare">
        <div class="player-heading">
            <div class="cover" aria-hidden="true">♫</div>

            <div class="track-info">
                <h2 id="track-title">Välj en predikan</h2>
                <p class="track-meta" id="track-meta">
                    Välj ett avsnitt i listan nedan
                </p>
            </div>
        </div>

        <div class="controls">
            <button id="play-button" class="play-button"
                    type="button" aria-label="Spela upp" disabled>
                ▶
            </button>

            <button id="back-button" class="skip-button"
                    type="button" aria-label="Hoppa bakåt 15 sekunder">
                ↶ 15
            </button>

            <div class="timeline">
                <input id="progress" class="progress"
                       type="range" min="0" max="1000" value="0"
                       aria-label="Spelposition">

                <div class="time-row">
                    <span id="current-time">0:00</span>
                    <span id="duration">–:––</span>
                </div>
            </div>

            <button id="forward-button" class="skip-button"
                    type="button" aria-label="Hoppa framåt 15 sekunder">
                15 ↷
            </button>
        </div>

        <audio id="audio" preload="none"></audio>
    </section>

    <!-- SÖKFÄLTET LAGGTS TILL HÄR -->
    <div class="search-container">
        <input type="text" id="search-input" class="search-input" placeholder="Sök på titel, predikant eller datum...">
    </div>

    <div class="list-heading">
        <h2>Alla predikningar</h2>
        <span id="episode-count"></span>
    </div>

    <section id="episode-list" class="episode-list"
             aria-label="Avsnittslista" tabindex="0">
        <p class="status">Hämtar predikningar …</p>
    </section>

</main>

<script>
const audio = document.getElementById("audio");
const playButton = document.getElementById("play-button");
const backButton = document.getElementById("back-button");
const forwardButton = document.getElementById("forward-button");
const progress = document.getElementById("progress");
const currentTimeLabel = document.getElementById("current-time");
const durationLabel = document.getElementById("duration");
const trackTitle = document.getElementById("track-title");
const trackMeta = document.getElementById("track-meta");
const episodeList = document.getElementById("episode-list");
const episodeCount = document.getElementById("episode-count");
const searchInput = document.getElementById("search-input"); // Hämtar sökfältet

let episodes = [];
let filteredEpisodes = []; // Sparar de filtrerade resultaten separat
let selectedIndex = -1;

function formatTime(seconds) {
    if (!Number.isFinite(seconds) || seconds < 0) {
        return "0:00";
    }

    const total = Math.floor(seconds);
    const hours = Math.floor(total / 3600);
    const minutes = Math.floor((total % 3600) / 60);
    const secs = total % 60;

    if (hours > 0) {
        return `${hours}:${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
    }

    return `${minutes}:${String(secs).padStart(2, "0")}`;
}

function formatDate(value) {
    if (!value) return "";

    const date = new Date(value);

    return Number.isNaN(date.getTime())
        ? ""
        : date.toLocaleDateString("sv-SE");
}

function updatePlayButton() {
    const playing = !audio.paused;
    playButton.textContent = playing ? "Ⅱ" : "▶";
}

// NY FUNKTION: Renderar listan baserat på skickad array (alla eller sökresultat)
function renderEpisodes(listToRender) {
    episodeList.innerHTML = "";

    if (listToRender.length === 0) {
        episodeList.innerHTML = '<p class="status">Inga predikningar matchar din sökning.</p>';
        episodeCount.textContent = `0 av ${episodes.length}`;
        return;
    }

    // Uppdatera räknaren (visar t.ex. "5 av 42")
    if (listToRender.length === episodes.length) {
        episodeCount.textContent = `${episodes.length} st`;
    } else {
        episodeCount.textContent = `${listToRender.length} av ${episodes.length}`;
    }

    listToRender.forEach((episode, index) => {
        const row = document.createElement("div");
        row.className = "episode-row";
        
        // Hitta om detta element råkar vara det som spelas just nu
        // Vi mäter mot originalindexet i huvudlistan för att behålla rätt ljudfil
Använd koden med försiktighet.
const originalIndex = episodes.indexOf(episode);
if (originalIndex === selectedIndex) {
row.classList.add("selected");
}
const dateStr = formatDate(episode.date || episode.pubDate);
const speakerStr = episode.speaker || episode.author || "Okänd predikant";
row.innerHTML = <div class="row-play">▶</div> <div class="row-info"> <h3 class="row-title">${episode.title}</h3> <div class="row-meta">${dateStr} • ${speakerStr}</div> </div>;
row.addEventListener("click", () => {
selectEpisode(originalIndex);
});
episodeList.appendChild(row);
});
}
// NY EVENT LISTENER: Filtrerar listan när användaren skriver
searchInput.addEventListener("input", (e) => {
const query = e.target.value.toLowerCase().trim();
filteredEpisodes = episodes.filter(episode => {
const title = (episode.title || "").toLowerCase();
const speaker = (episode.speaker || episode.author || "").toLowerCase();
const dateStr = formatDate(episode.date || episode.pubDate).toLowerCase();
return title.includes(query) || speaker.includes(query) || dateStr.includes(query);
});
renderEpisodes(filteredEpisodes);
});
function selectEpisode(index) {
if (index < 0 || index >= episodes.length) return;
selectedIndex = index;
const episode = episodes[selectedIndex];
trackTitle.textContent = episode.title;
const speakerStr = episode.speaker || episode.author || "Okänd predikant";
trackMeta.textContent = ${formatDate(episode.date || episode.pubDate)} • ${speakerStr};
// Antar att url ligger i episode.url eller i en RSS enclosure
const audioUrl = episode.url || (episode.enclosure ? episode.enclosure.url : "");
audio.src = audioUrl;
playButton.disabled = false;
audio.play().catch(err => console.log("Autoplay blockerades:", err));
// Rita om listan så rätt rad markeras som aktiv ("selected")
renderEpisodes(filteredEpisodes.length > 0 || searchInput.value ? filteredEpisodes : episodes);
}
// --- DUMMYDATA FÖR DEMO (Ersätts av din riktiga API/RSS-hämtning nedan) ---
// I din riktiga kod tilldelar du bara din data till episodes och kör filteredEpisodes = episodes; renderEpisodes(episodes);
episodes = [
{ title: "Att vandra i tro", speaker: "Stefan Salomonsson", date: "2026-10-15", url: "#" },
{ title: "Nåd och frid över staden", speaker: "Maria Eriksson", date: "2026-10-08", url: "#" },
{ title: "Hopp och framtid", speaker: "Stefan Salomonsson", date: "2026-09-24", url: "#" }
];
filteredEpisodes = episodes;
renderEpisodes(episodes);
// ------------------------------------------------------------------------
// Eventuella spelarkontroller (play/pause osv.) fortsätter här nedan...
audio.addEventListener("play", updatePlayButton);
audio.addEventListener("pause", updatePlayButton);
